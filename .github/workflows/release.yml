name: Release

on:
  push:
    tags: ["v*"]

# Never run two publishes at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate the publish behind a GitHub environment so it can require approval.
    environment: crates-io
    permissions:
      contents: read
      # Exchanged for a short-lived crates.io token (trusted publishing).
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Refuse to publish if the tag and the manifest disagree.
      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "weaverbird") | .version')
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - run: cargo test --all-features

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
